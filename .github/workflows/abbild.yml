# Abbild bauen und ausliefern — der automatische Weg.
#
# WARUM HIER UND NICHT BEI RUNPOD. Bis zum 24.08.2026 baute RunPods
# GitHub-Integration das Abbild: nur per Konsole einzurichten, an den
# Endpoint gebunden (mit ihm geloescht), und "ein Push allein baut
# nicht zuverlaessig" (docs/UEBERGABE.md im Hauptrepo — defeae0 blieb
# liegen, erst das Release stiess den Bau an). Hier baut jeder Push,
# nachvollziehbar im Actions-Protokoll, und das Abbild gehoert uns —
# es ueberlebt jeden Endpoint.
#
# WOHIN. ghcr.io/jiromusik/heartbeat-songform. Getaggt mit dem kurzen
# Commit-Hash (unveraenderlich, das zieht der Endpoint), bei Releases
# zusaetzlich mit der Versionsnummer, auf master zusaetzlich "latest".
#
# AUSROLLEN. Steht in den Repo-Einstellungen ein RUNPOD_API_KEY
# (Secret) und eine RUNPOD_TEMPLATE_ID (Variable), zieht der zweite
# Job das RunPod-Template per PATCH auf den frischen Hash-Tag — der
# naechste Kaltstart faehrt das neue Abbild. Fehlt beides, bleibt der
# Bau einfach liegen: bauen und ausrollen sind getrennte Entscheidungen.
name: abbild

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Der Laeufer hat ~14 GB frei, das Abbild samt Basis und
      # gebackenen Gewichten braucht mehr. Die vorinstallierten SDKs
      # (dotnet, Android, Haskell) nutzt dieser Bau nie.
      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jiromusik/heartbeat-songform
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  ausrollen:
    needs: bauen
    runs-on: ubuntu-latest
    steps:
      - name: RunPod-Template auf das neue Abbild ziehen
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          TEMPLATE_ID: ${{ vars.RUNPOD_TEMPLATE_ID }}
        run: |
          if [ -z "$RUNPOD_API_KEY" ] || [ -z "$TEMPLATE_ID" ]; then
            echo "Kein RunPod-Ziel hinterlegt — Bau liegt bereit, ausgerollt wird nicht."
            exit 0
          fi
          curl -fsS -X PATCH "https://rest.runpod.io/v1/templates/$TEMPLATE_ID" \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"imageName\": \"ghcr.io/jiromusik/heartbeat-songform:${GITHUB_SHA:0:7}\"}"
          echo "Template $TEMPLATE_ID zeigt jetzt auf :${GITHUB_SHA:0:7}"
