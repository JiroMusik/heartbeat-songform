# Abbild bauen und ausliefern — der automatische Weg.
#
# WARUM HIER UND NICHT BEI RUNPOD. Bis zum 24.08.2026 baute RunPods
# GitHub-Integration das Abbild: nur per Konsole einzurichten, an den
# Endpoint gebunden (mit ihm geloescht), und "ein Push allein baut
# nicht zuverlaessig" (docs/UEBERGABE.md im Hauptrepo — defeae0 blieb
# liegen, erst das Release stiess den Bau an). Hier baut jeder Push,
# nachvollziehbar im Actions-Protokoll, und das Abbild gehoert uns —
# es ueberlebt jeden Endpoint.
#
# WOHIN. ghcr.io/jiromusik/heartbeat-songform. Getaggt mit dem kurzen
# Commit-Hash (unveraenderlich, das zieht der Endpoint), bei Releases
# zusaetzlich mit der Versionsnummer, auf master zusaetzlich "latest".
#
# AUSROLLEN passiert NICHT hier (25.08.2026): der Lichtrechner traegt
# den RunPod-Schluessel ohnehin und bumpt das Template selbst
# (cloud_worker.ausrollen, Knopf "Abbild aktualisieren" in der
# Rechenkarte). Ein GitHub-Secret fuer denselben Schluessel waere eine
# zweite Kopie an einem zweiten Ort — genau die Sorte Drift, die das
# Projekt plagt.
name: abbild

on:
  push:
    branches: [master]
    # Skripte und Doku aendern das Abbild nicht — ein 8-GB-Bau fuer
    # eine README-Zeile waere reine Verschwendung.
    paths-ignore:
      - "scripts/**"
      - "README.md"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Actions auf Commit-SHA festgenagelt (nicht auf bewegliche Tags):
      # bei "packages: write" koennte ein uebernommenes Action-Tag Code
      # einschleusen, der GITHUB_TOKEN abgreift und ":latest" vergiftet.
      # Version im Kommentar; Erneuerung z. B. via Dependabot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Der Laeufer hat ~14 GB frei, das Abbild samt Basis und
      # gebackenen Gewichten braucht mehr. Die vorinstallierten SDKs
      # (dotnet, Android, Haskell) nutzt dieser Bau nie.
      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/jiromusik/heartbeat-songform
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
